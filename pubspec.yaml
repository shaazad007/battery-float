name: battery_float
description: A transparent floating battery monitor for Windows 10 and 11.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  battery_plus: ^6.2.3
  window_manager: ^0.4.3
  tray_manager: ^0.3.0
  shared_preferences: ^2.3.5
  local_notifier: ^0.1.6

flutter:
  uses-material-design: true
